    button { background-image: none; padding-left: 0.75rem; text-align: center; }

    const wilayaTranslations = {
      "01": { "ar": "أدرار", "en": "Adrar", "fr": "Adrar", "tam": "ⴰⴷⵔⴰⵔ" },
      // ... أضف باقي الترجمات كما في الكود السابق إذا أردت
      // للاختصار تركتها قليلة، يمكن نسخها من الكود السابق
    };

    const wilayaSelect = document.getElementById('wilaya-select');
    const baladiyaSelect = document.getElementById('baladiya-select');
    const showLinkBtn = document.getElementById('show-link-btn');
    const languageSelect = document.getElementById('language-select');

    let selectedWilaya = localStorage.getItem('selectedWilaya') || '';
    let selectedBaladiya = localStorage.getItem('selectedBaladiya') || '';
    let selectedLanguage = localStorage.getItem('selectedLanguage') || 'ar';

    languageSelect.value = selectedLanguage;
    updateLanguage();

    function updateLanguage() {
      const lang = languageSelect.value;
      document.documentElement.lang = lang;
      localStorage.setItem('selectedLanguage', lang);

      document.querySelector('h1').textContent = {
        "ar": "ولايات وبلديات الجزائر",
        "en": "Wilayas and Communes of Algeria",
        "fr": "Wilayas et Communes de l'Algérie",
        "tam": "ⵡⵉⵍⴰⵢⴰⵜ ⴷ ⵜⴰⵎⵎⵓⵔⵜ ⵏ ⵍⵣⴰⵢⵔ"
      }[lang];

      Array.from(wilayaSelect.options).forEach(option => {
        if (option.value) {
          const code = option.value;
          const name = wilayaTranslations[code]?.[lang] || option.textContent.split(' - ')[1]?.split(' ')[0] || '';
          option.textContent = `${code} - ${name} ${wilayatWithLinks[code] ? '✅' : '❌'}`;
        }
      });
    }

    function updateShowButton() {
      const wilaya = wilayaSelect.value;
      const baladiya = baladiyaSelect.value;

      const hasWilayaLink = !!wilayatWithLinks[wilaya];
      const hasBaladiyaLink = baladiya && baladiyatWithLinks[wilaya]?.[baladiya];

      showLinkBtn.disabled = !(hasWilayaLink || hasBaladiyaLink);
    }

    wilayaSelect.addEventListener('change', () => {
      const wilaya = wilayaSelect.value;
      baladiyaSelect.innerHTML = '<option value="" disabled selected>اختر بلدية (إن وجدت)</option>';
      baladiyaSelect.disabled = true;

      if (wilaya && baladiyatWithLinks[wilaya]) {
        baladiyaSelect.disabled = false;
        Object.entries(baladiyatWithLinks[wilaya]).forEach(([name, link]) => {
          const opt = document.createElement('option');
          opt.value = name;
          opt.dataset.link = link;
          opt.textContent = `${name} ${link ? '✅' : '❌'}`;
          baladiyaSelect.appendChild(opt);
        });
      }

      updateShowButton();
      localStorage.setItem('selectedWilaya', wilaya);
    });

    baladiyaSelect.addEventListener('change', () => {
      updateShowButton();
      localStorage.setItem('selectedBaladiya', baladiyaSelect.value);
    });

    showLinkBtn.addEventListener('click', () => {
      const wilaya = wilayaSelect.value;
      const baladiya = baladiyaSelect.value;

      let link = wilayatWithLinks[wilaya];

      if (!link && baladiya && baladiyatWithLinks[wilaya]?.[baladiya]) {
        link = baladiyatWithLinks[wilaya][baladiya];
      }

      if (link) window.open(link, '_blank');
    });

    languageSelect.addEventListener('change', updateLanguage);

    if (selectedWilaya) {
      wilayaSelect.value = selectedWilaya;
      wilayaSelect.dispatchEvent(new Event('change'));
      if (selectedBaladiya) {
        baladiyaSelect.value = selectedBaladiya;
        baladiyaSelect.dispatchEvent(new Event('change'));
      }
    }
