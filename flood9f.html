<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ولايات وبلديات الجزائر</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      background: linear-gradient(180deg, #4B0082, #00B7EB);
      min-height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 1rem;
      color: #FFFFFF;
    }
    h1 { color: #FFFFFF; margin-bottom: 4rem; }
    .select-container {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      width: 100%;
      max-width: 32rem;
    }
    select, button {
      background: rgba(255, 255, 255, 0.1);
      color: #FFFFFF;
      border: 1px solid #FFFFFF;
      border-radius: 0.5rem;
      padding: 0.75rem;
      font-size: 1rem;
      cursor: pointer;
      outline: none;
      appearance: none;
      -webkit-appearance: none;
      -moz-appearance: none;
      background-image: url('data:image/svg+xml;utf8,<svg fill="white" height="24" viewBox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg"><path d="M7 10l5 5 5-5z"/></svg>');
      background-repeat: no-repeat;
      background-position: left 0.75rem center;
      padding-left: 2.5rem;
      width: 100%;
    }
    select option { color: #000000; background: #FFFFFF; }
    button { background-image: none; padding-left: 0.75rem; text-align: center; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .language-select { margin-top: 2rem; width: 10rem; }
  </style>
</head>
<body>
  <div>
    <h1 class="text-3xl font-bold">ولايات وبلديات الجزائر</h1>
    <div class="select-container">
      <select id="wilaya-select">
        <option value="" disabled selected>اختر ولاية</option>
        <!-- قائمة الولايات كما هي مع ✅ / ❌ -->
        <option value="01">01 - أدرار ❌</option>
        <option value="02">02 - الشلف ❌</option>
        <option value="03">03 - الأغواط ❌</option>
        <!-- ... باقي الولايات ... -->
        <option value="47">47 - غرداية ✅</option>
        <!-- ... -->
        <option value="59">59 - آفلو ✅</option>
        <!-- ... باقي الولايات حتى 69 ... -->
      </select>

      <select id="baladiya-select" disabled>
        <option value="" disabled selected>اختر بلدية (اختياري – يمكن تخطيها)</option>
      </select>

      <button id="show-link-btn" disabled>عرض الخريطة</button>
    </div>
  </div>

  <select id="language-select" class="language-select">
    <option value="ar">العربية</option>
    <option value="en">English</option>
    <option value="fr">Français</option>
    <option value="tam">ⵜⴰⵎⴰⵣⵉⵖⵜ (Tamazight)</option>
  </select>

  <script>
    // روابط الولايات المباشرة (يمكن توسيعها)
    const wilayatWithLinks = {
      "47": "https://raresalim.github.io/inondation-gh/#14/32.4842/3.6826",  // غرداية
      "59": "https://raresalim.github.io/inondation-Af/#14/34.1077/2.1163"   // آفلو
    };

    // البلديات لكل ولاية (5 كحد أقصى – بدون روابط حالياً)
    const baladiyatWithLinks = {
      "01": { "أدرار": "", "تيميمون": "", "رقان": "", "أولاد سعيد": "", "تسابيت": "" },
      "02": { "الشلف": "", "تنس": "", "بوقادير": "", "أبو الحسن": "", "وادي الفضة": "" },
      "03": { "الأغواط": "", "قصر الحيران": "", "عين ماضي": "", "حاسي الرمل": "", "بريدة": "" },
      "04": { "أم البواقي": "", "عين البيضاء": "", "فكيرينة": "", "سيقوس": "", "عين كرشة": "" },
      "05": { "باتنة": "", "مروانة": "", "نقاوس": "", "عين التوتة": "", "بريكة": "" },
      // أضف باقي الولايات بنفس الطريقة ...
      "47": { "غرداية": "", "متليلي": "", "المنيعة": "", "ضاية بن ضحوة": "", "بريان": "" },
      "59": { "آفلو": "", "سيدي بوزيد": "", "الحويطة": "", "الأغواط": "", "بريدة": "" },
      // ... أكمل باقي الولايات حسب الحاجة
    };

    const wilayaSelect = document.getElementById('wilaya-select');
    const baladiyaSelect = document.getElementById('baladiya-select');
    const showLinkBtn = document.getElementById('show-link-btn');

    function updateShowButton() {
      const wilaya = wilayaSelect.value;
      const baladiya = baladiyaSelect.value;

      const wilayaHasLink = !!wilayatWithLinks[wilaya];
      const baladiyaHasLink = baladiya && baladiyatWithLinks[wilaya] && baladiyatWithLinks[wilaya][baladiya];

      showLinkBtn.disabled = !(wilayaHasLink || baladiyaHasLink);
    }

    wilayaSelect.addEventListener('change', () => {
      const selectedWilaya = wilayaSelect.value;

      // إعادة تعبئة قائمة البلديات
      baladiyaSelect.innerHTML = '<option value="" selected>اختر بلدية (اختياري – يمكن تخطيها)</option>';
      baladiyaSelect.disabled = true;

      if (selectedWilaya && baladiyatWithLinks[selectedWilaya]) {
        baladiyaSelect.disabled = false;
        Object.keys(baladiyatWithLinks[selectedWilaya]).forEach(baladiyaName => {
          const option = document.createElement('option');
          option.value = baladiyaName;
          option.textContent = baladiyaName;
          baladiyaSelect.appendChild(option);
        });
      }

      updateShowButton();
    });

    baladiyaSelect.addEventListener('change', updateShowButton);

    showLinkBtn.addEventListener('click', () => {
      const wilaya = wilayaSelect.value;
      const baladiya = baladiyaSelect.value;

      let link = wilayatWithLinks[wilaya];

      // إذا لم يكن هناك رابط ولاية ولكن تم اختيار بلدية لها رابط
      if (!link && baladiya && baladiyatWithLinks[wilaya] && baladiyatWithLinks[wilaya][baladiya]) {
        link = baladiyatWithLinks[wilaya][baladiya];
      }

      if (link) {
        window.open(link, '_blank');
      } else {
        alert('لا يوجد رابط متاح لهذه الاختيارات حاليًا');
      }
    });

    // تهيئة أولية
    wilayaSelect.dispatchEvent(new Event('change'));
  </script>
</body>
</html>
