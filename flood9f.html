<!-- البلديات -->
<select id="baladiya-select" disabled>
<option disabled selected>اختر بلدية</option>
</select>


<button id="show-link-btn" disabled>عرض</button>

<div id="link-display"></div>

<script>

const baladiyatWithLinks = {

"01": { "أدرار":"", "تيميمون":"", "رقان":"" },
"02": { "الشلف":"", "تنس":"", "بوقادير":"" },
"03": { "الأغواط":"", "قصر الحيران":"" },
"04": { "أم البواقي":"", "عين البيضاء":"", "فكيرينة":"" },
"05": { "باتنة":"", "مروانة":"", "نقاوس":"" },
"47": { "بريان":"" }

};


const wilayaSelect   = document.getElementById("wilaya-select");
const baladiyaSelect = document.getElementById("baladiya-select");
const showBtn        = document.getElementById("show-link-btn");


// عند اختيار ولاية
wilayaSelect.addEventListener("change", ()=>{

  const code = wilayaSelect.value;
  const option = wilayaSelect.selectedOptions[0];
  const wilayaLink = option.dataset.link;

  baladiyaSelect.disabled = false;

  baladiyaSelect.innerHTML =
    '<option disabled selected>اختر بلدية</option>';

  showBtn.disabled = true;


  // تحميل البلديات
  if(baladiyatWithLinks[code]){

    for(const name in baladiyatWithLinks[code]){

      const link = baladiyatWithLinks[code][name];

      const opt = document.createElement("option");

      opt.value = name;
      opt.dataset.link = link;

      opt.textContent =
        name + (link ? " ✅":" ❌");

      baladiyaSelect.appendChild(opt);

    }
  }

  // تفعيل الزر إذا للولاية رابط
  if(wilayaLink){
    showBtn.disabled = false;
  }

});


// عند اختيار بلدية
baladiyaSelect.addEventListener("change", ()=>{

  const option = baladiyaSelect.selectedOptions[0];
  const link = option ? option.dataset.link:"";

  showBtn.disabled = !link;

});


// زر عرض
showBtn.addEventListener("click", ()=>{

  const wilayaOpt = wilayaSelect.selectedOptions[0];
  const wilayaLink = wilayaOpt.dataset.link;

  const baladiyaOpt = baladiyaSelect.selectedOptions[0];
  const baladiyaLink = baladiyaOpt
    ? baladiyaOpt.dataset.link:"";

  const finalLink = wilayaLink || baladiyaLink;

  if(finalLink){
    window.open(finalLink,"_blank");
  }else{
    alert("لا يوجد رابط");
  }

});

</script>
