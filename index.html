<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ولايات وبلديات الجزائر</title>

<style>

body{
  font-family:Arial;
  background:linear-gradient(180deg,#4B0082,#00B7EB);
  min-height:100vh;
  margin:0;

  display:flex;
  justify-content:center;
  align-items:center;

  direction:rtl;
  color:white;
}

.container{

  width:100%;
  max-width:350px;

  display:flex;
  flex-direction:column;
  gap:15px;
}

/* القوائم */
select,button{

  width:100%;
  padding:12px;
  font-size:16px;

  border-radius:8px;
  border:1px solid white;

  background:rgba(255,255,255,0.15);
  color:white;

  cursor:pointer;
}

option{
  color:black;
}

button:disabled{
  opacity:0.5;
  cursor:not-allowed;
}

</style>
</head>


<body>

<div class="container">

<h2 style="text-align:center">ولايات وبلديات الجزائر</h2>


<!-- الولايات -->
<select id="wilaya-select">

<option value="">اختر ولاية</option>

<option value="01">01 - أدرار ❌</option>
<option value="02">02 - الشلف ❌</option>
<option value="03">03 - الأغواط ✅</option>
<option value="04">04 - أم البواقي ❌</option>
<option value="05">05 - باتنة ❌</option>
<option value="47">47 - غرداية ✅</option>

</select>


<!-- البلديات -->
<select id="baladiya-select" disabled>

<option value="">اختر بلدية</option>

</select>


<button id="show-link-btn" disabled>
عرض الخريطة
</button>


</div>


<script>

/* بيانات البلديات */
const baladiyatWithLinks = {

  "01":{
    "أدرار":"",
    "تيميمون":"",
    "رقان":""
  },

  "02":{
    "الشلف":"",
    "تنس":"",
    "بوقادير":""
  },

  "03":{
    "الأغواط":"https://raresalim.github.io/inondation-Af/#14/34.1077/2.1163",
    "قصر الحيران":"",
    "أفلو":"https://raresalim.github.io/inondation-Af/#14/34.1077/2.1163"
  },

  "04":{
    "أم البواقي":"",
    "عين البيضاء":"",
    "فكيرينة":""
  },

  "05":{
    "باتنة":"",
    "مروانة":"",
    "نقاوس":""
  },

  "47":{
    "غرداية":"https://raresalim.github.io/inondation-gh/#14/32.4842/3.6826",
    "بريان":""
  }

};


const wilayaSelect   = document.getElementById("wilaya-select");
const baladiyaSelect = document.getElementById("baladiya-select");
const showBtn        = document.getElementById("show-link-btn");


// عند اختيار ولاية
wilayaSelect.addEventListener("change",()=>{

  const code = wilayaSelect.value;

  // تفريغ البلديات
  baladiyaSelect.innerHTML =
   '<option value="">اختر بلدية</option>';

  // فتح القائمة
  baladiyaSelect.disabled = false;

  showBtn.disabled = true;


  if(!baladiyatWithLinks[code]) return;


  // إضافة البلديات
  Object.entries(baladiyatWithLinks[code])
  .forEach(([name,link])=>{

    const opt = document.createElement("option");

    opt.value = name;
    opt.dataset.link = link;

    opt.textContent =
     name + (link ? " ✅" : " ❌");

    baladiyaSelect.appendChild(opt);

  });

});


// عند اختيار بلدية
baladiyaSelect.addEventListener("change",()=>{

  const opt = baladiyaSelect.selectedOptions[0];

  const link = opt ? opt.dataset.link : "";

  showBtn.disabled = !link;

});


// زر العرض
showBtn.addEventListener("click",()=>{

  const opt = baladiyaSelect.selectedOptions[0];

  if(!opt) return;

  const link = opt.dataset.link;

  if(link){
    window.open(link,"_blank");
  }

});

</script>

</body>
</html>
