<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ولايات وبلديات الجزائر</title>
<style>
body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: linear-gradient(180deg, #4B0082, #00B7EB);
  font-family: Arial, sans-serif;
  color: white;
}

.container {
  width: 100%;
  max-width: 400px;
  display: flex;
  flex-direction: column;
  gap: 18px;
  padding: 25px 15px;
  text-align: center;
}

.logo {
  font-size: 2.6rem;
  font-weight: bold;
  margin: 0 0 35px 0;
  letter-spacing: 2px;
  text-shadow: 0 3px 12px rgba(0,0,0,0.5);
  color: #f0f8ff;
}

h2 {
  margin: 10px 0 25px;
  font-size: 1.5rem;
  opacity: 0.95;
}

select, button {
  width: 100%;
  padding: 13px 16px;
  font-size: 16px;
  border-radius: 10px;
  border: 1px solid rgba(255,255,255,0.45);
  background: rgba(255,255,255,0.14);
  color: white;
  cursor: pointer;
  backdrop-filter: blur(5px);
  -webkit-appearance: none;
}

select:focus, button:hover:not(:disabled) {
  background: rgba(255,255,255,0.26);
  border-color: rgba(255,255,255,0.75);
}

option {
  color: black;
  background: white;
}

button:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}

#error-message {
  display: none;
  background: rgba(220, 53, 69, 0.28);
  color: #ffdddd;
  padding: 18px 20px;
  border-radius: 12px;
  margin: 20px 0;
  font-size: 1.1rem;
  border: 1px solid rgba(220, 53, 69, 0.55);
  line-height: 1.5;
}
</style>
</head>
<body>

<div class="container">

  <div class="logo">plemuvium</div>

  <h2>ولايات وبلديات الجزائر (69 ولاية)</h2>

  <select id="wilaya-select">
    <option value="">اختر ولاية</option>
  </select>

  <select id="baladiya-select" disabled>
    <option value="">اختر بلدية</option>
  </select>

  <button id="show-link-btn" disabled>
    عرض الخريطة
  </button>

  <div id="error-message"></div>

</div>

<script>
// بيانات البلديات (يمكن توسيعها لاحقاً)
const baladiyatWithLinks = {
  "01": { "أدرار":"", "رقان":"", "تيميمون":"" },
  "02": { "الشلف":"", "تنس":"", "بوقادير":"" },
  "47": {
    "غرداية": "https://raresalim.github.io/inondation-gh/#14/32.4842/3.6826",
    "بريان": "",
    "القرارة": ""
  },
  "59": {
    "آفلو": "https://raresalim.github.io/inondation-Af/#14/34.1077/2.1163",
    "عين سيدي علي": "",
    "سبقاق": ""
  },
  // أضف المزيد من البلديات والروابط عند الحاجة
};

// قائمة الولايات الكاملة 01 إلى 69
const wilayas = [
  {code:"01", name:"أدرار"},
  {code:"02", name:"الشلف"},
  {code:"03", name:"الأغواط"},
  {code:"04", name:"أم البواقي"},
  {code:"05", name:"باتنة"},
  {code:"06", name:"بجاية"},
  {code:"07", name:"بسكرة"},
  {code:"08", name:"بشار"},
  {code:"09", name:"البليدة"},
  {code:"10", name:"البويرة"},
  {code:"11", name:"تمنراست"},
  {code:"12", name:"تبسة"},
  {code:"13", name:"تلمسان"},
  {code:"14", name:"تيارت"},
  {code:"15", name:"تيزي وزو"},
  {code:"16", name:"الجزائر"},
  {code:"17", name:"الجلفة"},
  {code:"18", name:"جيجل"},
  {code:"19", name:"سطيف"},
  {code:"20", name:"سعيدة"},
  {code:"21", name:"سكيكدة"},
  {code:"22", name:"سيدي بلعباس"},
  {code:"23", name:"عنابة"},
  {code:"24", name:"قالمة"},
  {code:"25", name:"قسنطينة"},
  {code:"26", name:"المدية"},
  {code:"27", name:"مستغانم"},
  {code:"28", name:"المسيلة"},
  {code:"29", name:"معسكر"},
  {code:"30", name:"ورقلة"},
  {code:"31", name:"وهران"},
  {code:"32", name:"البيض"},
  {code:"33", name:"إليزي"},
  {code:"34", name:"برج بوعريريج"},
  {code:"35", name:"بومرداس"},
  {code:"36", name:"الطارف"},
  {code:"37", name:"تندوف"},
  {code:"38", name:"تيسمسيلت"},
  {code:"39", name:"الوادي"},
  {code:"40", name:"خنشلة"},
  {code:"41", name:"سوق أهراس"},
  {code:"42", name:"تيبازة"},
  {code:"43", name:"ميلة"},
  {code:"44", name:"عين الدفلى"},
  {code:"45", name:"النعامة"},
  {code:"46", name:"عين تيموشنت"},
  {code:"47", name:"غرداية"},
  {code:"48", name:"غليزان"},
  {code:"49", name:"تيميمون"},
  {code:"50", name:"برج باجي مختار"},
  {code:"51", name:"أولاد جلال"},
  {code:"52", name:"بني عباس"},
  {code:"53", name:"عين صالح"},
  {code:"54", name:"عين قزام"},
  {code:"55", name:"تقرت"},
  {code:"56", name:"جانت"},
  {code:"57", name:"المغير"},
  {code:"58", name:"المنيعة"},
  {code:"59", name:"آفلو"},
  {code:"60", name:"بريكة"},
  {code:"61", name:"القنطرة"},
  {code:"62", name:"بئر العاتر"},
  {code:"63", name:"العريشة"},
  {code:"64", name:"قصر الشلالة"},
  {code:"65", name:"عين وسارة"},
  {code:"66", name:"مسعد"},
  {code:"67", name:"قصر البخاري"},
  {code:"68", name:"بوسعادة"},
  {code:"69", name:"الأبيض سيدي الشيخ"}
];

const wilayaSelect   = document.getElementById("wilaya-select");
const baladiyaSelect = document.getElementById("baladiya-select");
const showBtn        = document.getElementById("show-link-btn");
const errorDiv       = document.getElementById("error-message");

// ملء قائمة الولايات مع الإشارات ✅ / ❌
wilayas.forEach(w => {
  const hasLink = baladiyatWithLinks[w.code] &&
                  Object.values(baladiyatWithLinks[w.code]).some(link => link && link.trim().length > 5);

  const emoji = hasLink ? "✅ " : "❌ ";

  const opt = document.createElement("option");
  opt.value = w.code;
  opt.textContent = `${emoji}${w.code} ${w.name}`;
  wilayaSelect.appendChild(opt);
});

// عند اختيار ولاية
wilayaSelect.addEventListener("change", () => {
  const code = wilayaSelect.value;
  baladiyaSelect.innerHTML = '<option value="">اختر بلدية</option>';
  baladiyaSelect.disabled = !code;
  showBtn.disabled = true;
  errorDiv.style.display = "none";

  if (!code || !baladiyatWithLinks[code]) return;

  for (const name in baladiyatWithLinks[code]) {
    const link = baladiyatWithLinks[code][name];
    const opt = document.createElement("option");
    opt.value = name;
    opt.dataset.link = link;
    opt.textContent = name + (link && link.trim().length > 5 ? " ✅" : " ❌");
    baladiyaSelect.appendChild(opt);
  }
});

// عند اختيار بلدية
baladiyaSelect.addEventListener("change", () => {
  const opt = baladiyaSelect.selectedOptions[0];
  if (!opt || opt.value === "") {
    showBtn.disabled = true;
    return;
  }
  const link = opt.dataset.link?.trim() || "";
  showBtn.disabled = !(link.length > 5);
  errorDiv.style.display = "none";
});

// زر عرض الخريطة ← الجزء المعدل الذي طلبت إضافته
showBtn.addEventListener("click", () => {
  errorDiv.style.display = "none";

  if (!navigator.onLine) {
    errorDiv.innerHTML = `
      <strong>لا يوجد اتصال بالإنترنت</strong><br><br>
      لا يمكن عرض الخريطة حاليًا<br>
      تحقق من الشبكة ثم حاول مرة أخرى
    `;
    errorDiv.style.display = "block";
    return;
  }

  const opt = baladiyaSelect.selectedOptions[0];
  if (!opt) return;

  const link = opt.dataset.link?.trim() || "";
  if (!link || link.length < 6) {
    alert("لا يوجد رابط متاح");
    return;
  }

  // انتقال داخل نفس الصفحة
  window.location.href = link;
});

</script>
</body>
</html>
