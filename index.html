<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ولايات وبلديات الجزائر</title>
<style>
body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: linear-gradient(180deg, #4B0082, #00B7EB);
  font-family: Arial, sans-serif;
  color: white;
}

.container {
  width: 100%;
  max-width: 380px;
  display: flex;
  flex-direction: column;
  gap: 18px;
  padding: 20px 15px;
}

.logo {
  font-size: 2.4rem;
  font-weight: bold;
  text-align: center;
  margin: 0 0 30px 0;
  letter-spacing: 2px;
  text-shadow: 0 3px 10px rgba(0,0,0,0.5);
  color: #f0f8ff;
}

h2 {
  text-align: center;
  margin: 10px 0 25px;
  font-size: 1.45rem;
  opacity: 0.95;
}

select, button {
  width: 100%;
  padding: 13px 16px;
  font-size: 16px;
  border-radius: 10px;
  border: 1px solid rgba(255,255,255,0.5);
  background: rgba(255,255,255,0.13);
  color: white;
  cursor: pointer;
  backdrop-filter: blur(4px);
  -webkit-appearance: none;
}

select:focus, button:hover:not(:disabled) {
  background: rgba(255,255,255,0.25);
  border-color: rgba(255,255,255,0.8);
}

option {
  color: black;
  background: white;
}

button:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}
</style>
</head>
<body>

<div class="container">

  <div class="logo">plemuvium</div>

  <h2>ولايات وبلديات الجزائر</h2>

  <select id="wilaya-select">
    <option value="">اختر ولاية</option>
  </select>

  <select id="baladiya-select" disabled>
    <option value="">اختر بلدية</option>
  </select>

  <button id="show-link-btn" disabled>
    عرض الخريطة
  </button>

</div>

<script>
// بيانات البلديات
const baladiyatWithLinks = {
  "01": { "أدرار":"", "رقان":"", "تيميمون":"" },
  "02": { "الشلف":"", "تنس":"", "بوقادير":"" },
  "03": { "الأغواط":"", "قصر الحيران":"", "مليليحة":"" },
  "04": { "أم البواقي":"", "عين البيضاء":"", "فكيرينة":"" },
  "05": { "باتنة":"", "مروانة":"", "نقاوس":"" },
  "06": { "بجاية":"", "أوقاس":"", "أميزور":"" },
  "07": { "بسكرة":"", "طولقة":"", "سيدي عقبة":"" },
  "08": { "بشار":"", "العبادلة":"", "بني ونيف":"" },
  "09": { "البليدة":"", "بوفاريك":"", "موزاية":"" },
  "10": { "البويرة":"", "سور الغزلان":"", "الأخضرية":"" },
  "16": { "باب الوادي":"", "حسين داي":"", "بئر مراد رايس":"" },
  "17": { "الجلفة":"", "عين وسارة":"", "مسعد":"" },
  "19": { "سطيف":"", "عين ولمان":"", "العلمة":"" },
  "28": { "المسيلة":"", "بوسعادة":"", "سيدي عيسى":"" },
  "31": { "وهران":"", "عين الترك":"", "السانية":"" },
  "47": {
    "غرداية": "https://raresalim.github.io/inondation-gh/#14/32.4842/3.6826",
    "بريان": "",
    "القرارة": ""
  },
  "59": {
    "آفلو": "https://raresalim.github.io/inondation-Af/#14/34.1077/2.1163",
    "عين سيدي علي": "",
    "سبقاق": ""
  },
  "60": { "بريكة":"", "تكوت":"", "عيون العصافير":"" },
  "61": { "القنطرة":"", "المزيرعة":"", "الدوسن":"" },
  "62": { "بئر العاتر":"", "نقرين":"", "الشريعة":"" },
  "63": { "العريشة":"", "سبدو":"", "المغنية":"" },
  "64": { "قصر الشلالة":"", "بوغزول":"", "عين دقة":"" },
  "65": { "عين وسارة":"", "حد الصحاري":"", "سلمانة":"" },
  "66": { "مسعد":"", "دلدول":"", "سد رحال":"" },
  "67": { "قصر البخاري":"", "أولاد عنتر":"", "الزبوجة":"" },
  "68": { "بوسعادة":"", "الهامل":"", "أولاد سيدي إبراهيم":"" },
  "69": { "الأبيض":"", "سيدي الشيخ":"", "بوقطب":"" }
};

// قائمة الولايات
const wilayas = [
  {code:"01", name:"أدرار"}, {code:"02", name:"الشلف"}, {code:"03", name:"الأغواط"},
  {code:"04", name:"أم البواقي"}, {code:"05", name:"باتنة"}, {code:"06", name:"بجاية"},
  {code:"07", name:"بسكرة"}, {code:"08", name:"بشار"}, {code:"09", name:"البليدة"},
  {code:"10", name:"البويرة"}, {code:"11", name:"تمنراست"}, {code:"12", name:"تبسة"},
  {code:"13", name:"تلمسان"}, {code:"14", name:"تيارت"}, {code:"15", name:"تيزي وزو"},
  {code:"16", name:"الجزائر"}, {code:"17", name:"الجلفة"}, {code:"18", name:"جيجل"},
  {code:"19", name:"سطيف"}, {code:"20", name:"سعيدة"}, {code:"21", name:"سكيكدة"},
  {code:"22", name:"سيدي بلعباس"}, {code:"23", name:"عنابة"}, {code:"24", name:"قالمة"},
  {code:"25", name:"قسنطينة"}, {code:"26", name:"المدية"}, {code:"27", name:"مستغانم"},
  {code:"28", name:"المسيلة"}, {code:"29", name:"معسكر"}, {code:"30", name:"ورقلة"},
  {code:"31", name:"وهران"}, {code:"32", name:"البيض"}, {code:"33", name:"إليزي"},
  {code:"34", name:"برج بوعريريج"}, {code:"35", name:"بومرداس"}, {code:"36", name:"الطارف"},
  {code:"37", name:"تندوف"}, {code:"38", name:"تيسمسيلت"}, {code:"39", name:"الوادي"},
  {code:"40", name:"خنشلة"}, {code:"41", name:"سوق أهراس"}, {code:"42", name:"تيبازة"},
  {code:"43", name:"ميلة"}, {code:"44", name:"عين الدفلى"}, {code:"45", name:"النعامة"},
  {code:"46", name:"عين تيموشنت"}, {code:"47", name:"غرداية"}, {code:"48", name:"غليزان"},
  {code:"49", name:"تيميمون"}, {code:"50", name:"برج باجي مختار"}, {code:"51", name:"أولاد جلال"},
  {code:"52", name:"بني عباس"}, {code:"53", name:"عين صالح"}, {code:"54", name:"عين قزام"},
  {code:"55", name:"تقرت"}, {code:"56", name:"جانت"}, {code:"57", name:"المغير"},
  {code:"58", name:"المنيعة"}, {code:"59", name:"آفلو"}, {code:"60", name:"بريكة"},
  {code:"61", name:"القنطرة"}, {code:"62", name:"بئر العاتر"}, {code:"63", name:"العريشة"},
  {code:"64", name:"قصر الشلالة"}, {code:"65", name:"عين وسارة"}, {code:"66", name:"مسعد"},
  {code:"67", name:"قصر البخاري"}, {code:"68", name:"بوسعادة"}, {code:"69", name:"الأبيض سيدي الشيخ"}
];

const wilayaSelect = document.getElementById("wilaya-select");
const baladiyaSelect = document.getElementById("baladiya-select");
const showBtn = document.getElementById("show-link-btn");

// ملء قائمة الولايات مع الإشارات ✅ / ❌
wilayas.forEach(w => {
  const hasLink = baladiyatWithLinks[w.code] && 
                  Object.values(baladiyatWithLinks[w.code]).some(link => link && link.trim().length > 5);
  
  const emoji = hasLink ? "✅ " : "❌ ";
  
  const opt = document.createElement("option");
  opt.value = w.code;
  opt.textContent = `${emoji}${w.code} ${w.name}`;
  wilayaSelect.appendChild(opt);
});

// عند اختيار ولاية
wilayaSelect.addEventListener("change", () => {
  const code = wilayaSelect.value;
  baladiyaSelect.innerHTML = '<option value="">اختر بلدية</option>';
  baladiyaSelect.disabled = !code;
  showBtn.disabled = true;

  if (!code || !baladiyatWithLinks[code]) return;

  for (const name in baladiyatWithLinks[code]) {
    const link = baladiyatWithLinks[code][name];
    const opt = document.createElement("option");
    opt.value = name;
    opt.dataset.link = link;
    opt.textContent = name + (link && link.trim().length > 5 ? " ✅" : " ❌");
    baladiyaSelect.appendChild(opt);
  }
});

// عند اختيار بلدية
baladiyaSelect.addEventListener("change", () => {
  const opt = baladiyaSelect.selectedOptions[0];
  if (!opt || opt.value === "") {
    showBtn.disabled = true;
    return;
  }
  const link = opt.dataset.link?.trim() || "";
  showBtn.disabled = !(link.length > 5);
});

// زر عرض الخريطة
showBtn.addEventListener("click", () => {
  const opt = baladiyaSelect.selectedOptions[0];
  if (!opt) return;
  const link = opt.dataset.link?.trim() || "";
  if (link.length > 5) {
    window.open(link, "_blank");
  } else {
    alert("لا يوجد رابط متاح لهذه البلدية");
  }
});
</script>
</body>
</html>
